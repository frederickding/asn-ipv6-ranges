include:
  - component: $CI_SERVER_FQDN/components/go/test@1.1.1
    inputs:
      go_image: golang:1.24
  - component: $CI_SERVER_FQDN/components/go/build@1.1.1
    inputs:
      go_image: golang:1.24

variables:
  IMAGE_NAME: "$CI_REGISTRY_IMAGE"

stages:
  - build
  - test
  - package

build-docker-image: &build-docker
  stage: package
  image: registry.access.redhat.com/ubi10/podman
  tags:
    - podman
  before_script:
    - rm /var/lib/containers/storage/* -fr
  script:
    - test $CI_COMMIT_BRANCH = "$CI_DEFAULT_BRANCH" || export IMAGE_NAME="$IMAGE_NAME/$CI_COMMIT_BRANCH"
    - echo "$IMAGE_NAME"
    # Computed before the build, not after: VERSION_TAG is both the image tag
    # and the version stamped into the binary, so /-/version names the exact
    # image to pull.
    - export VERSION_TAG=$(date -u '+%Y%m%d')-$(echo $CI_COMMIT_SHA | head -c7)
    - podman build --build-arg VERSION="$VERSION_TAG" -t "$IMAGE_NAME" .
    - podman tag "$IMAGE_NAME" "$IMAGE_NAME:$VERSION_TAG"
    - podman login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
    - podman push "$IMAGE_NAME:$VERSION_TAG"
    - podman rmi "$IMAGE_NAME" "$IMAGE_NAME:$VERSION_TAG"
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: '$CI_SERVER_HOST == "gitlab.fjd.io" && $CI_PIPELINE_SOURCE == "push"'
    - when: manual

build-docker-image-tags:
  <<: *build-docker
  script:
    # The tag verbatim, "v" included, matching github.ref_name in
    # .github/workflows/docker-publish.yml so the same git tag reports the same
    # version whichever CI built it.
    - export VERSION_TAG="$CI_COMMIT_TAG"
    - podman build --build-arg VERSION="$VERSION_TAG" -t "$IMAGE_NAME" .
    - podman tag "$IMAGE_NAME" "$IMAGE_NAME:$VERSION_TAG"
    - podman login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
    - podman push "$IMAGE_NAME:$VERSION_TAG"
    - podman rmi "$IMAGE_NAME" "$IMAGE_NAME:$VERSION_TAG"
  rules:
    - if: $CI_COMMIT_TAG
      when: always